spring.application.name=Back

# Configuración de la Base de Datos (se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/puntocoma}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:patito123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080
server.address=0.0.0.0

# JWT (en producción definir JWT_SECRET con al menos 32 caracteres)
app.jwt.secret=${JWT_SECRET:puntocoma-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrador inicial (se crea si no existe ningún ADMIN)
app.admin.email=${ADMIN_EMAIL:admin@puntocoma.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# Libros de ejemplo para el catálogo (sólo si la tabla está vacía)
app.seed.libros=true

# Préstamos
app.prestamos.dias-default=14
app.prestamos.max-activos=3
app.prestamos.multa-por-dia=10.00
